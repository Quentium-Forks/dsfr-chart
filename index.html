<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" href="./favicon.ico" />

  <title>DSFR Charts</title>
</head>

<body>
  <!-- DEV DATABOX STATIC -->
  <div style="max-width: 500px; padding: 40px">
    <data-box2></data-box2>
  </div>

  <!-- DEV PARENT / CHARTS LINK -->
  <div>
    <parent-comp
                 id="abc"
                 title="Databox">
    </parent-comp>

    <scatter-chart
                   databox-id="abc"
                   databox-type="chart"
                   x="[[1926, 1928, 1930, 1932, 1934, 1936, 1938, 1940, 1942, 1944, 1946, 1948, 1950], [1926, 1928, 1930, 1932, 1934, 1936, 1938, 1940, 1942, 1944, 1946, 1948, 1950], [1926, 1928, 1930, 1932, 1934, 1936, 1938, 1940, 1942, 1944, 1946, 1948, 1950]]"
                   y="[[35, 35, 37, 37, 39, 41, 43, 48, 51, 52, 54, 55, 56], [76, 83, 82, 80, 81, 80, 81, 80, 81, 80, 79, 75, 72], [54, 56, 58, 57, 59, 60, 62, 64, 66, 66, 66, 65, 64]]"
                   name='["Femmes", "Hommes", "Ensemble"]'
                   unit-tooltip="%"
                   show-line="true">
    </scatter-chart>

    <table-chart
                 databox-id="abc"
                 databox-type="table"
                 x="[1926, 1928, 1930, 1932, 1934, 1936, 1938, 1940, 1942, 1944, 1946, 1948, 1950]"
                 y="[[35, 35, 37, 37, 39, 41, 43, 48, 51, 52, 54, 55, 56], [76, 83, 82, 80, 81, 80, 81, 80, 81, 80, 79, 75, 72], [54, 56, 58, 57, 59, 60, 62, 64, 66, 66, 66, 65, 64]]"
                 table-name="Jours">
    </table-chart>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.dsfr && window.dsfr.start) {
        window.dsfr.start();
      }
    });
  </script>
</body>

</html>
