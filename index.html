<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" href="./favicon.ico" />

  <title>DSFR Charts</title>
  <style>
    .code-toolbar {
      background-color: #f5f2f0;
      overflow: scroll;
    }

    .attr-name,
    .builtin,
    .char,
    .inserted,
    .selector,
    .string {
      color: #690;
    }

    .punctuation {
      color: #999;
    }

    .tag {
      color: #905;
    }

    .class {
      color: #000091;
    }

    .color_dot {
      min-width: 1.5rem;
      width: 1.5rem;
      height: 1.5rem;
      min-width: 1.5rem;
      display: inline-block;
      margin-top: 0rem;
      margin-left: 1rem;
    }

    .fr-display-button {
      position: fixed;
      bottom: 3.5rem;
      right: 2rem;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="./src/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.dsfr && window.dsfr.start) {
        window.dsfr.start();
      }
    });
  </script>
</body>

</html>
